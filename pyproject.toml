[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snoorthka-trainplat_jd129"
version = "0.1.0"
description = "把候选项映射到类别上，算出大模型训练平台工程师·拒答边界与过度拒答的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "snoorthka" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://snoorthka.github.io"
Repository = "https://github.com/snoorthka/trainplat_jd129"
Issues = "https://github.com/snoorthka/trainplat_jd129/issues"

[project.scripts]
trainplat_jd129 = "trainplat_jd129:main"

[tool.setuptools]
py-modules = ["trainplat_jd129"]
